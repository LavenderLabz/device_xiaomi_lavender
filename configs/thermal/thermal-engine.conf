# SENSOR : ALIAS
# battery : batt_therm
# tsens_tz_sensor8 : gpu
# tsens_tz_sensor6 : cpu7
# tsens_tz_sensor5 : cpu6
# tsens_tz_sensor4 : cpu5
# tsens_tz_sensor3 : cpu4
# tsens_tz_sensor1 : cpu0-cpu1-cpu2-cpu3

[BATTERY_CHARGING_CTL]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 48000 50000 52000
thresholds_clr 46000 48000 50000
actions battery battery battery
action_info 1 2 3

[SS-QUIET-THERM-GOLD]
#algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu4
set_point 53000
set_point_clr 50000
time_constant 0
device_max_limit 1747200

[SS-QUIET-THERM-SILVER]
#algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu0
set_point 53000
set_point_clr 50000
time_constant 0
device_max_limit 1536000

[SS-QUIET-THERM-GPU]
#algo_type ss
sampling 2000
sensor quiet-therm-adc
device gpu
set_point 53000
set_point_clr 50000
time_constant 0
device_max_limit 266000000

[MODEM_PROC_TEMP_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 53000 60000
thresholds_clr 50000 57000
actions modem_proc+report modem_proc+report
action_info 1+0 3+0

[MODEM_PA_MITIGATION]
disable 1

[MODEM_PA_THERM0_MITIGATION]
disable 1

[MODEM_PA_THERM1_MITIGATION]
disable 1

[CAMERA_SKIN_EXIT_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 60000
thresholds_clr 55000
actions camera+camcorder
action_info 10+10

[LCD_management]
disable 1
